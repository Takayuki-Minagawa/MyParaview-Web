worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Preserve the external scheme from a trusted TLS terminator. Local/direct
    # HTTP requests and malformed client-supplied values fall back to nginx's
    # own scheme, so redirect URLs never inherit an arbitrary URI scheme.
    map $http_x_forwarded_proto $pvweb_forwarded_proto {
        ~*^https$ https;
        default $scheme;
    }

    map $http_host $pvweb_forwarded_host {
        default $http_host;
        '' $host;
    }

    upstream pvweb_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/;
        }

        # The trailing slash on proxy_pass intentionally strips /api.  FastAPI
        # owns routes such as /health and /sessions/{id}/ws at its root.
        location /api/ {
            proxy_pass http://pvweb_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $pvweb_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $pvweb_forwarded_host;
            proxy_set_header X-Forwarded-Proto $pvweb_forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Required for job-event SSE and long uploads/ParaView operations.
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
