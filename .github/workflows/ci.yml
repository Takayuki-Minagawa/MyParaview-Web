name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
        working-directory: backend
      - run: python -m pytest -q python
      - run: >-
          PVWEB_DATABASE_URL=postgresql+psycopg://u:p@localhost/db
          alembic -c alembic.ini upgrade head --sql > /tmp/pvweb-postgres.sql
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pvweb
          POSTGRES_USER: pvweb
          POSTGRES_PASSWORD: pvweb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pvweb -d pvweb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PVWEB_DATABASE_URL: postgresql+psycopg://pvweb:pvweb@localhost:5432/pvweb
      PVWEB_DATA_ROOT: /tmp/pvweb-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python -c "from sqlalchemy import create_engine,text; from app.config import settings; e=create_engine(settings.database_url); assert e.connect().execute(text('select version_num from alembic_version')).scalar() == '0008'"
        working-directory: backend
