name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install ruff via requirements-dev.txt so its version policy lives in
      # one place with the other dev dependencies.
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check --config backend/ruff.toml backend workers python
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend
      - run: python -m pytest -q python
      - run: >-
          PVWEB_DATABASE_URL=postgresql+psycopg://u:p@localhost/db
          alembic -c alembic.ini upgrade head --sql > /tmp/pvweb-postgres.sql
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The Playwright config launches the backend via backend/.venv.
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pvweb
          POSTGRES_USER: pvweb
          POSTGRES_PASSWORD: pvweb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pvweb -d pvweb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PVWEB_DATABASE_URL: postgresql+psycopg://pvweb:pvweb@localhost:5432/pvweb
      PVWEB_DATA_ROOT: /tmp/pvweb-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python -m scripts.verify_postgres_tags
        working-directory: backend
